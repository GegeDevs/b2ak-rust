services:
  b2ak:
    # Published multi-arch image built from a GitHub Release.
    # Pin an exact version (e.g. gegedesembri/b2ak:0.1.0) for reproducible
    # deployments, or keep `latest` and run `docker compose pull` to update.
    image: gegedesembri/b2ak:latest
    # To build from source instead, comment out `image` and uncomment:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: b2ak-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKSPACE_DIR: /app/workspace
    volumes:
      # Persists the Telegram session, usage.json and the cached magiskboot.
      - bot_data:/app/workspace
    stop_grace_period: 30s
    networks:
      - b2ak-net

volumes:
  bot_data:
    driver: local

networks:
  b2ak-net:
    driver: bridge
