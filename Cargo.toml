[package]
name = "b2ak"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
description = "Telegram bot that turns an Android boot.img into an AnyKernel flashable zip"
readme = "README.md"

[[bin]]
name = "b2ak"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dotenvy = "0.15"
futures-util = "0.3"
grammers-client = { version = "0.11", features = ["markdown", "fs"] }
grammers-session = "0.11"
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
