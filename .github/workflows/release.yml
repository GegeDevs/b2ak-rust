name: Release

# Tag pushes are the normal release path:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The manual trigger can publish the same tag without pushing it first; the
# release step creates the tag on the selected commit when it does not exist.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v0.1.0). Must match Cargo.toml.'
        required: true
        type: string

# Serialize releases so a tag push and a manual dispatch cannot race when
# creating the tag or uploading assets. Never cancel one halfway through.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve and validate version
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            raw="$INPUT_VERSION"
          else
            raw="$REF_NAME"
          fi

          # Accept both `v1.2.3` and `1.2.3`.
          version="${raw#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' is not a valid release version (expected vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi

          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')"
          if [[ "$version" != "$cargo_version" ]]; then
            echo "::error::Release version '$version' does not match Cargo.toml version '$cargo_version'"
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "Releasing b2ak v$version (prerelease: $prerelease)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
          - arch: armv7
            target: armv7-unknown-linux-musleabihf
          - arch: i686
            target: i686-unknown-linux-musl

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.89'
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          key: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build static binary
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          binary="target/$TARGET/release/b2ak"
          test -x "$binary"
          file "$binary"

          stage="$(mktemp -d)"
          install -m 0755 "$binary" "$stage/b2ak"
          cp README.md .env.example "$stage/"

          mkdir -p dist
          archive="dist/b2ak-$VERSION-linux-$ARCH.tar.gz"
          tar -czf "$archive" -C "$stage" b2ak README.md .env.example
          tar -tzf "$archive"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: b2ak-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: b2ak ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body: |
            Static Linux builds of the Telegram `boot.img` → AnyKernel bot.

            ## Downloads

            | Architecture | Rust target | Archive |
            | --- | --- | --- |
            | x86_64 | `x86_64-unknown-linux-musl` | `b2ak-${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz` |
            | aarch64 / arm64 | `aarch64-unknown-linux-musl` | `b2ak-${{ needs.prepare.outputs.version }}-linux-aarch64.tar.gz` |
            | armv7 / armhf | `armv7-unknown-linux-musleabihf` | `b2ak-${{ needs.prepare.outputs.version }}-linux-armv7.tar.gz` |
            | i686 / x86 | `i686-unknown-linux-musl` | `b2ak-${{ needs.prepare.outputs.version }}-linux-i686.tar.gz` |

            Each archive contains the statically linked `b2ak` binary, `README.md`
            and `.env.example`.

            ## Install

            ```bash
            tar -xzf b2ak-${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz
            cp .env.example .env
            $EDITOR .env
            ./b2ak
            ```

            The bot needs `git` and `ca-certificates` at runtime. `magiskboot` is
            downloaded from the latest Magisk APK on first use and cached in
            `WORKSPACE_DIR`.

            ## Verify checksums

            ```bash
            sha256sum -c SHA256SUMS
            ```
