name: Docker Hub

# The Release workflow dispatches this workflow after it publishes a GitHub
# Release, so the image is always built from the same static binaries that are
# attached to the release. Manual runs are possible for any existing release:
#
#   gh workflow run docker.yml -f version=v0.1.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release to package (e.g. v0.1.0)'
        required: true
        type: string

# Two runs publishing the same tag would race on the manifest list.
concurrency:
  group: docker-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve release
    runs-on: ubuntu-latest
    # Docker Hub credentials are environment secrets, so the job must declare
    # the environment for `secrets.DOCKERHUB_*` to resolve.
    environment: DOCKERHUB
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Validate credentials and release assets
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${DOCKERHUB_USERNAME:-}" ]]; then
            echo "::error::DOCKERHUB_USERNAME secret is not set"
            exit 1
          fi
          if [[ -z "${DOCKERHUB_TOKEN:-}" ]]; then
            echo "::error::DOCKERHUB_TOKEN secret is not set"
            exit 1
          fi

          raw="$INPUT_VERSION"
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' is not a valid version (expected vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi
          tag="v$version"

          if ! assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"; then
            echo "::error::Release $tag does not exist in $GITHUB_REPOSITORY"
            exit 1
          fi

          for arch in x86_64 aarch64 armv7 i686; do
            expected="b2ak-$version-linux-$arch.tar.gz"
            if ! grep -qxF "$expected" <<< "$assets"; then
              echo "::error::Release $tag is missing asset $expected"
              exit 1
            fi
          done

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          # Do not export the image name as a job output: it contains the
          # secret username, and GitHub skips such outputs. Each job computes
          # it locally instead.
          echo "Resolved release $tag (prerelease: $prerelease)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            release_arch: x86_64
            platform: linux/amd64
          - arch: arm64
            release_arch: aarch64
            platform: linux/arm64
          - arch: armv7
            release_arch: armv7
            platform: linux/arm/v7
          - arch: '386'
            release_arch: i686
            platform: linux/386

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compute image name
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          # Docker Hub repository names must be lowercase.
          echo "IMAGE=${DOCKERHUB_USERNAME,,}/b2ak" >> "$GITHUB_ENV"

      - name: Download release binary
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
        run: |
          set -euo pipefail

          mkdir -p docker-context assets
          cp Dockerfile.release docker-context/Dockerfile

          asset="b2ak-$VERSION-linux-$RELEASE_ARCH.tar.gz"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" --dir assets
          tar -xzf "assets/$asset" -C docker-context b2ak
          chmod 0755 docker-context/b2ak
          file docker-context/b2ak

      # Needed only for `apk add` in the foreign-platform runtime stage.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: ${{ matrix.platform }}
          push: true
          # With push-by-digest, tags must be repository names without a tag.
          tags: ${{ env.IMAGE }}
          # Push each platform by digest; the merge job assembles the final
          # multi-arch manifest list with human-readable tags.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.title=b2ak
            org.opencontainers.image.description=Telegram bot that turns an Android boot.img into an AnyKernel flashable zip
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Store image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p digests
          echo "$IMAGE@$DIGEST" > "digests/digest-$ARCH"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/digest-*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Compute image name
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          # Docker Hub repository names must be lowercase.
          echo "IMAGE=${DOCKERHUB_USERNAME,,}/b2ak" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          sources=()
          while IFS= read -r source; do
            sources+=("$source")
          done < <(cat digests/digest-*)

          tags=(--tag "$IMAGE:$VERSION")

          # Prereleases must not move `latest` or the major.minor tag.
          if [[ "$VERSION" != *-* ]]; then
            tags+=(--tag "$IMAGE:${VERSION%.*}")
            tags+=(--tag "$IMAGE:latest")
          fi

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect published image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$VERSION"
